/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

group = 'org.turboframework'
version = providers.fileContents(layout.projectDirectory.file('version.properties'))
    .asText
    .map { text ->
        def versionLine = text.readLines().find { line -> line.startsWith('version=') }
        versionLine ? versionLine.split('=', 2)[1].trim() : '0.0.0'
    }
    .get()
description = 'TurboCommons-Java'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
