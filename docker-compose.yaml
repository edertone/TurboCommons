services:
  toolbox:
    image: turbocommons/toolbox:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        NODE_VERSION: "22.23.2"
        NPM_VERSION: "10.9.8"
        COMPOSER_VERSION: "2.8.10"
        COMPOSER_SHA256: "28dbb6bd8bef31479c7985b774c130a8bda37dbe63c35b56f6cb6bc377427573"
        PHP_PACKAGE_VERSION: "8.2.32-1~deb12u1"
        JDK_PACKAGE_VERSION: "17.0.20+8-1~deb12u1"
        SHELLCHECK_VERSION: "0.10.0"
        SHELLCHECK_SHA256: "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - turbocommons-node-modules:/opt/turbocommons/node_modules
      - turbocommons-ts-node-modules:/opt/turbocommons-ts/node_modules
      - turbocommons-php-vendor:/workspace/packages/turbocommons-php/vendor
      - turbocommons-npm-cache:/opt/npm-cache
      - turbocommons-composer-cache:/opt/composer/cache
      - turbocommons-gradle-cache:/opt/gradle
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_HOME: /opt/composer
      GRADLE_USER_HOME: /opt/gradle
      NX_DAEMON: "false"
      npm_config_cache: /opt/npm-cache
    init: true

volumes:
  turbocommons-node-modules:
  turbocommons-ts-node-modules:
  turbocommons-php-vendor:
  turbocommons-npm-cache:
  turbocommons-composer-cache:
  turbocommons-gradle-cache:
