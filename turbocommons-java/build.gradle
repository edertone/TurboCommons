/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

group = 'org.turboframework'
version = providers.fileContents(layout.projectDirectory.file('version.properties'))
    .asText
    .map { text ->
        def versionLine = text.readLines().find { line -> line.startsWith('version=') }
        versionLine ? versionLine.split('=', 2)[1].trim() : '0.0.0'
    }
    .get()
description = 'TurboCommons-Java'
java.sourceCompatibility = JavaVersion.VERSION_17
java.targetCompatibility = JavaVersion.VERSION_17


publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
